name: Test one platform

# One platform's lane of release.yml: build the compiler once, then run the
# tests/ suite and the examples as two sharded matrices on that binary. Each
# matrix fails fast within itself; other platforms are not affected. The gate
# job publishes the platform's pass marker once every part passed.

on:
  workflow_call:
    inputs:
      name: { type: string, required: true }
      os: { type: string, required: true }
      goos: { type: string, required: true }
      goarch: { type: string, required: true }
      # The example runner is a POSIX Makefile recipe: false on Windows.
      examples: { type: boolean, default: true }

env:
  # Keep in step with the matrices below.
  SHARDS: 6
  EXAMPLE_SHARDS: 4
  BIN: klainmain${{ inputs.goos == 'windows' && '.exe' || '' }}

jobs:
  build:
    name: build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go build -o ${{ env.BIN }} .
      - run: go vet ./...
      - uses: actions/upload-artifact@v7
        with:
          name: klainmain-${{ inputs.name }}
          path: ${{ env.BIN }}
          retention-days: 1

  test:
    name: ${{ matrix.part }}
    needs: build
    runs-on: ${{ inputs.os }}
    # Windows (MSYS2 setup, Defender) gets more room. go test's own -timeout
    # catches a hang before the job ceiling does.
    timeout-minutes: ${{ inputs.goos == 'windows' && 90 || 60 }}
    strategy:
      fail-fast: true
      matrix:
        part: [unit, shard-0, shard-1, shard-2, shard-3, shard-4, shard-5]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with: { goos: '${{ inputs.goos }}' }
      - uses: actions/download-artifact@v8
        with: { name: 'klainmain-${{ inputs.name }}' }
      - run: chmod +x ${{ env.BIN }}
        shell: bash

      # One real compile first: a broken platform layer fails here in seconds
      # instead of as hundreds of link errors fifty minutes later.
      - name: Smoke-compile and run one program
        if: matrix.part == 'unit'
        shell: bash
        run: ./${{ env.BIN }} examples/basics/basics.ts && ./examples/basics/basics
      - name: docs/status pages match their data/ JSON (reference lane only)
        if: matrix.part == 'unit' && inputs.name == 'linux-x64'
        run: make -o build status-check
      - name: Unit packages (every package but tests/)
        if: matrix.part == 'unit'
        shell: bash
        run: go test -timeout 50m $(go list ./... | grep -v '/tests$')
      - name: Suite shard
        if: startsWith(matrix.part, 'shard-')
        shell: bash
        run: |
          part='${{ matrix.part }}'
          go run ./tools/testshard -shard "${part#shard-}" -shards "$SHARDS" -timeout 50m

  examples:
    name: ${{ matrix.part }}
    needs: build
    if: inputs.examples
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        part: [examples-0, examples-1, examples-2, examples-3, drift]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with: { goos: '${{ inputs.goos }}' }
      - uses: actions/download-artifact@v8
        with: { name: 'klainmain-${{ inputs.name }}' }
      - run: chmod +x ${{ env.BIN }}
      # -o build: use the downloaded compiler, don't rebuild it.
      - name: Compile and run one shard of the examples
        if: startsWith(matrix.part, 'examples-')
        run: |
          part='${{ matrix.part }}'
          make -o build examples SHARD="${part#examples-}" SHARDS="$EXAMPLE_SHARDS"
      - name: The builtin library compiles the same everywhere, deterministically
        if: matrix.part == 'drift'
        run: make -o build drift

  gate:
    name: gate
    needs: [test, examples]
    if: always() && needs.test.result == 'success' && (needs.examples.result == 'success' || needs.examples.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p gate
          echo "${{ inputs.goos }} ${{ inputs.goarch }} ${{ inputs.name }}" > "gate/${{ inputs.name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: gate-${{ inputs.name }}
          path: gate/${{ inputs.name }}
          retention-days: 1
