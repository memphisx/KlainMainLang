name: Test one platform

# One platform's lane of release.yml: build the compiler and run the unit
# packages once, then the tests/ suite in shards (each shard's tests spread
# over the runner's cores) and the examples on that binary, failing fast.
# Other platforms are not affected. The gate job publishes the platform's
# pass marker once every part passed.

on:
  workflow_call:
    inputs:
      name: { type: string, required: true }
      os: { type: string, required: true }
      goos: { type: string, required: true }
      goarch: { type: string, required: true }
      # The example runner is a POSIX Makefile recipe: false on Windows.
      examples: { type: boolean, default: true }

env:
  # Keep in step with the shard matrix below.
  SHARDS: 4
  BIN: klainmain${{ inputs.goos == 'windows' && '.exe' || '' }}

jobs:
  build:
    name: build + unit
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with: { goos: '${{ inputs.goos }}' }
      - run: go build -o ${{ env.BIN }} .
      - run: go vet ./...
      # One real compile first: a broken platform layer fails here in seconds
      # instead of as hundreds of link errors later.
      - name: Smoke-compile and run one program
        shell: bash
        run: ./${{ env.BIN }} examples/basics/basics.ts && ./examples/basics/basics
      - name: docs/status pages match their data/ JSON (reference lane only)
        if: inputs.name == 'linux-x64'
        run: make -o build status-check
      - name: Unit packages (every package but tests/)
        shell: bash
        run: go test -timeout 25m $(go list ./... | grep -v '/tests$')
      - uses: actions/upload-artifact@v7
        with:
          name: klainmain-${{ inputs.name }}
          path: ${{ env.BIN }}
          retention-days: 1

  test:
    name: ${{ matrix.part }}
    needs: build
    runs-on: ${{ inputs.os }}
    # Windows (MSYS2 setup, Defender) gets more room. go test's own -timeout
    # catches a hang before the job ceiling does.
    timeout-minutes: ${{ inputs.goos == 'windows' && 90 || 45 }}
    strategy:
      fail-fast: true
      matrix:
        part: [shard-0, shard-1, shard-2, shard-3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with: { goos: '${{ inputs.goos }}' }
      # One test process per core: no test calls t.Parallel, so a shard run
      # as one process would use a single core of the runner.
      - name: Suite shard
        shell: bash
        run: |
          part='${{ matrix.part }}'
          go run ./tools/testshard -shard "${part#shard-}" -shards "$SHARDS" -timeout 40m

  examples:
    name: examples + drift
    needs: build
    if: inputs.examples
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with: { goos: '${{ inputs.goos }}' }
      - uses: actions/download-artifact@v8
        with: { name: 'klainmain-${{ inputs.name }}' }
      - run: chmod +x ${{ env.BIN }}
      # -o build: use the downloaded compiler, don't rebuild it.
      - name: Compile and run every example
        run: make -o build examples
      - name: The builtin library compiles the same everywhere, deterministically
        run: make -o build drift

  gate:
    name: gate
    needs: [test, examples]
    if: always() && needs.test.result == 'success' && (needs.examples.result == 'success' || needs.examples.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p gate
          echo "${{ inputs.goos }} ${{ inputs.goarch }} ${{ inputs.name }}" > "gate/${{ inputs.name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: gate-${{ inputs.name }}
          path: gate/${{ inputs.name }}
          retention-days: 1
