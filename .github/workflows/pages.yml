name: Deploy website to GitHub Pages

# Builds the Quasar SSG site in website/ and publishes it to GitHub Pages.
# Requires: repo Settings → Pages → "Build and deployment" → Source = GitHub Actions.

on:
  push:
    branches: [main]
    # Only rebuild when something that affects the site changes.
    paths:
      - 'website/**'
      - 'examples/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Regenerates src/data/examples-*.json from ../examples, then builds SSG.
      # Served from the root of the custom domain klainmain.dev (publicPath "/");
      # public/CNAME carries the domain into the published output.
      - name: Build (SSG)
        run: npm run build

      - name: Add .nojekyll
        run: touch dist/ssg/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist/ssg

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
