name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  # The Linux lanes' toolchain image (.github/ci/linux.Dockerfile), one per
  # architecture, tagged by the Dockerfile's hash. ci-image-ref finds out
  # whether both are already pushed; only when one is missing (the
  # Dockerfile changed) does ci-image build anything.
  ci-image-ref:
    runs-on: ubuntu-latest
    outputs:
      amd64: ${{ steps.ref.outputs.amd64 }}
      arm64: ${{ steps.ref.outputs.arm64 }}
      missing: ${{ steps.ref.outputs.missing }}
    steps:
      - uses: actions/checkout@v7
        with: { sparse-checkout: .github/ci }
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ref
        shell: bash
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          base="ghcr.io/$owner/klainmain-ci:${{ hashFiles('.github/ci/linux.Dockerfile') }}"
          missing=""
          for a in amd64 arm64; do
            echo "$a=$base-$a" >> "$GITHUB_OUTPUT"
            if docker manifest inspect "$base-$a" >/dev/null 2>&1; then echo "exists: $base-$a"
            else echo "missing: $base-$a"; missing="$missing $a"; fi
          done
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
  ci-image:
    needs: ci-image-ref
    if: needs.ci-image-ref.outputs.missing != ''
    strategy:
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - name: This architecture's image is missing?
        id: have
        shell: bash
        run: |
          case ' ${{ needs.ci-image-ref.outputs.missing }} ' in
            *' ${{ matrix.arch }} '*) echo "build=1" >> "$GITHUB_OUTPUT" ;;
            *) echo "already pushed" ;;
          esac
      - uses: actions/checkout@v7
        if: steps.have.outputs.build == '1'
        with: { sparse-checkout: .github/ci }
      # Where name lookups fail, if they do: the runner, a container on
      # Docker's bridge, a container on the host network.
      - name: DNS as the build sees it
        if: steps.have.outputs.build == '1'
        shell: bash
        run: |
          echo '== runner /etc/resolv.conf'; cat /etc/resolv.conf
          echo '== systemd-resolved upstreams'; cat /run/systemd/resolve/resolv.conf 2>/dev/null | grep -v '^#' || true
          echo '== docker daemon.json'; cat /etc/docker/daemon.json 2>/dev/null || echo none
          echo '== runner lookup'; getent hosts archive.ubuntu.com || echo FAIL
          echo '== bridge container'; docker run --rm ubuntu:26.04 bash -c 'cat /etc/resolv.conf; getent hosts archive.ubuntu.com || echo FAIL'
          echo '== host-network container'; docker run --rm --network host ubuntu:26.04 bash -c 'cat /etc/resolv.conf; getent hosts archive.ubuntu.com || echo FAIL'
      - uses: docker/login-action@v3
        if: steps.have.outputs.build == '1'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        if: steps.have.outputs.build == '1'
      - uses: docker/build-push-action@v6
        if: steps.have.outputs.build == '1'
        with:
          context: .github/ci
          file: .github/ci/linux.Dockerfile
          push: true
          tags: ${{ needs.ci-image-ref.outputs[matrix.arch] }}

  linux-x64:
    needs: [ci-image-ref, ci-image]
    if: always() && needs.ci-image-ref.result == 'success' && (needs.ci-image.result == 'success' || needs.ci-image.result == 'skipped')
    uses: ./.github/workflows/test-platform.yml
    with: { name: linux-x64, os: ubuntu-24.04, goos: linux, goarch: amd64, image: '${{ needs.ci-image-ref.outputs.amd64 }}' }
  linux-arm64:
    needs: [ci-image-ref, ci-image]
    if: always() && needs.ci-image-ref.result == 'success' && (needs.ci-image.result == 'success' || needs.ci-image.result == 'skipped')
    uses: ./.github/workflows/test-platform.yml
    with: { name: linux-arm64, os: ubuntu-24.04-arm, goos: linux, goarch: arm64, image: '${{ needs.ci-image-ref.outputs.arm64 }}' }
  macos-x64:
    uses: ./.github/workflows/test-platform.yml
    with: { name: macos-x64, os: macos-15-intel, goos: darwin, goarch: amd64 }
  macos-arm64:
    uses: ./.github/workflows/test-platform.yml
    with: { name: macos-arm64, os: macos-15, goos: darwin, goarch: arm64 }
  windows-x64:
    uses: ./.github/workflows/test-platform.yml
    with: { name: windows-x64, os: windows-latest, goos: windows, goarch: amd64, examples: false }

  # Runs even when some lanes failed: cuts the release if at least one lane is
  # green, and attaches a binary for each green platform, cross-compiled here
  # (the compiler is pure Go) once the tag is known so the version can be
  # stamped into it.
  release:
    needs: [linux-x64, linux-arm64, macos-x64, macos-arm64, windows-x64]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # go-semantic-release needs full tag history, not a shallow clone

      - name: Collect the platform gates
        uses: actions/download-artifact@v8
        with:
          pattern: gate-*
          path: gates
          merge-multiple: true

      - name: Decide which platforms passed
        id: gates
        shell: bash
        run: |
          # A platform passed when its lane's gate job published its marker.
          passed=""
          for p in linux-x64 linux-arm64 macos-x64 macos-arm64 windows-x64; do
            if [ -f "gates/$p" ]; then echo "PASS  $p"; passed="$passed $p"
            else echo "FAIL  $p (no binary will be attached for it)"; fi
          done
          echo "passed=${passed# }" >> "$GITHUB_OUTPUT"
          if [ -z "$passed" ]; then echo "::warning::no platform passed its tests — no release"; fi

      - name: Compute the next version and create the tag + GitHub Release
        if: steps.gates.outputs.passed != ''
        id: semrel
        uses: go-semantic-release/action@v1
        with:
          allow-initial-development-versions: 'true'
          custom-arguments: --allow-no-changes # a push with no feat/fix commits yields an empty version, not a failure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v7
        if: steps.gates.outputs.passed != '' && steps.semrel.outputs.version != ''
        with:
          go-version-file: go.mod
          cache: false

      - name: Cross-compile a version-stamped binary for each platform that passed
        if: steps.gates.outputs.passed != '' && steps.semrel.outputs.version != ''
        shell: bash
        run: |
          v="${{ steps.semrel.outputs.version }}"
          mkdir -p dist
          for p in ${{ steps.gates.outputs.passed }}; do
            read -r goos goarch name < "gates/$p"
            out="dist/klainmain-v$v-$name"
            [ "$goos" = windows ] && out="$out.exe"
            echo "building $out"
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X KlainMainLang/codegen/llvm.KlainVersion=$v" -o "$out" .
          done
          (cd dist && sha256sum klainmain-* > checksums.txt && cat checksums.txt)

      - name: Attach the binaries to the release
        if: steps.gates.outputs.passed != '' && steps.semrel.outputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ steps.semrel.outputs.version }}" dist/* --clobber
