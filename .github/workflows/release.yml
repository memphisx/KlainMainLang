name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # One lane per platform, all in parallel, none stopping the others
  # (TDD-00179). Each lane is test-platform.yml: the platform's parts (unit
  # packages, examples, the tests/ suite in shards) run in parallel and fail
  # fast within that platform only. The release job attaches a binary for each
  # platform whose every part passed.
  test:
    name: ${{ matrix.platform.name }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x64, os: ubuntu-latest, goos: linux, goarch: amd64, parts: '["unit","examples","shard-0","shard-1","shard-2","shard-3","shard-4","shard-5"]' }
          - { name: linux-arm64, os: ubuntu-24.04-arm, goos: linux, goarch: arm64, parts: '["unit","examples","shard-0","shard-1","shard-2","shard-3","shard-4","shard-5"]' }
          - { name: macos-x64, os: macos-15-intel, goos: darwin, goarch: amd64, parts: '["unit","examples","shard-0","shard-1","shard-2","shard-3","shard-4","shard-5"]' }
          - { name: macos-arm64, os: macos-15, goos: darwin, goarch: arm64, parts: '["unit","examples","shard-0","shard-1","shard-2","shard-3","shard-4","shard-5"]' }
          # The example runner is a POSIX Makefile recipe: no examples part.
          - { name: windows-x64, os: windows-latest, goos: windows, goarch: amd64, parts: '["unit","shard-0","shard-1","shard-2","shard-3","shard-4","shard-5"]' }
    uses: ./.github/workflows/test-platform.yml
    with:
      name: ${{ matrix.platform.name }}
      os: ${{ matrix.platform.os }}
      goos: ${{ matrix.platform.goos }}
      goarch: ${{ matrix.platform.goarch }}
      parts: ${{ matrix.platform.parts }}

  # Runs even when some lanes failed: cuts the release if at least one lane is
  # green, and attaches a binary for each green platform, cross-compiled here
  # (the compiler is pure Go) once the tag is known so the version can be
  # stamped into it.
  release:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # go-semantic-release needs full tag history, not a shallow clone

      - name: Collect the platform gates
        uses: actions/download-artifact@v8
        with:
          pattern: gate-*
          path: gates
          merge-multiple: true

      - name: Decide which platforms passed
        id: gates
        shell: bash
        run: |
          # A platform passed when every one of its parts published a gate:
          # its unit packages, its shards and (POSIX) its examples.
          shards=6 # keep in step with the test job's SHARDS
          passed=""
          for p in linux-x64 linux-arm64 macos-x64 macos-arm64 windows-x64; do
            parts="unit"; for i in $(seq 0 $((shards-1))); do parts="$parts shard-$i"; done
            [ "$p" = windows-x64 ] || parts="$parts examples"
            ok=1; for part in $parts; do [ -f "gates/$p--$part" ] || ok=0; done
            if [ $ok = 1 ]; then echo "PASS  $p"; cp "gates/$p--unit" "gates/$p"; passed="$passed $p"
            else echo "FAIL  $p (no binary will be attached for it)"; fi
          done
          echo "passed=${passed# }" >> "$GITHUB_OUTPUT"
          if [ -z "$passed" ]; then echo "::warning::no platform passed its tests — no release"; fi

      - name: Compute the next version and create the tag + GitHub Release
        if: steps.gates.outputs.passed != ''
        id: semrel
        uses: go-semantic-release/action@v1
        with:
          allow-initial-development-versions: 'true'
          custom-arguments: --allow-no-changes # a push with no feat/fix commits yields an empty version, not a failure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v7
        if: steps.gates.outputs.passed != '' && steps.semrel.outputs.version != ''
        with:
          go-version-file: go.mod
          cache: false

      - name: Cross-compile a version-stamped binary for each platform that passed
        if: steps.gates.outputs.passed != '' && steps.semrel.outputs.version != ''
        shell: bash
        run: |
          v="${{ steps.semrel.outputs.version }}"
          mkdir -p dist
          for p in ${{ steps.gates.outputs.passed }}; do
            read -r goos goarch name < "gates/$p"
            out="dist/klainmain-v$v-$name"
            [ "$goos" = windows ] && out="$out.exe"
            echo "building $out"
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X KlainMainLang/codegen/llvm.KlainVersion=$v" -o "$out" .
          done
          (cd dist && sha256sum klainmain-* > checksums.txt && cat checksums.txt)

      - name: Attach the binaries to the release
        if: steps.gates.outputs.passed != '' && steps.semrel.outputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ steps.semrel.outputs.version }}" dist/* --clobber
